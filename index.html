<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News2Day - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#070A13] text-slate-100 font-sans antialiased min-h-screen p-6">
    <div class="max-w-3xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-black text-white">NEWS2DAY <span class="text-red-600">ADMIN</span></h1>
                <p class="text-xs text-slate-400">Manage live articles & breaking news on your iPhone</p>
            </div>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl transition text-slate-300">View Live Site &rarr;</a>
        </header>

        <!-- Publish Article Form -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center"><i class="fa-solid fa-pen-nib text-red-500 mr-2"></i> Publish New Story</h2>
            
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Headline</label>
                <input type="text" id="art-title" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-red-500" placeholder="Enter article headline...">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Category</label>
                    <select id="art-category" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-red-500">
                        <option value="dublin ireland politics">Dublin / Ireland / Politics</option>
                        <option value="uk politics">UK Politics</option>
                        <option value="usa war">USA / Situation Room</option>
                        <option value="sport">Sport</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Tag Label (e.g. Breaking)</label>
                    <input type="text" id="art-tag" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-red-500" value="Dublin Breaking">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Short Preview Summary</label>
                <textarea id="art-summary" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-red-500" placeholder="Brief summary for the card..."></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Full Long-Form Article Body</label>
                <textarea id="art-body" rows="5" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-red-500" placeholder="Type or paste the complete news story here..."></textarea>
            </div>

            <button onclick="publishArticle()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-red-600/30">Publish Live to Website</button>
            <p id="status-msg" class="text-xs text-center text-emerald-400 font-medium"></p>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://nvwsfmielemfgrisyagy.supabase.co';
        const supabaseKey = 'Sb_publishable_ywhrtAKmnR-nlvWWggEuyg_78FD4uFn';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function publishArticle() {
            const title = document.getElementById('art-title').value;
            const category = document.getElementById('art-category').value;
            const tag = document.getElementById('art-tag').value;
            const summary = document.getElementById('art-summary').value;
            const body = document.getElementById('art-body').value;
            const msg = document.getElementById('status-msg');

            if(!title || !body) {
                alert('Please enter a headline and article body.');
                return;
            }

            msg.innerText = 'Publishing story...';

            const { data, error } = await supabaseClient
                .from('articles')
                .insert([{ title, category, tag, summary, body, created_at: new Date().toISOString() }]);

            if(error) {
                alert('Database Table note: Make sure your Supabase table named "articles" exists with columns: title, category, tag, summary, body, created_at.');
                msg.innerText = 'Error publishing. Check Supabase table setup.';
            } else {
                msg.innerText = 'Article published successfully! Check your live site.';
                document.getElementById('art-title').value = '';
                document.getElementById('art-summary').value = '';
                document.getElementById('art-body').value = '';
            }
        }
    </script>
</body>
</html>
