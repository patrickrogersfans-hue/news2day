<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News2Day - Professional Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#070A13] text-slate-100 font-sans antialiased min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-black text-white">NEWS<span class="text-red-600">2</span>DAY <span class="text-xs bg-red-600/20 text-red-400 px-2 py-1 rounded border border-red-500/30">ADMIN DESK</span></h1>
                <p class="text-xs text-slate-400">Manage live dispatches, categories, sports, politics, & situation room</p>
            </div>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl transition text-slate-300 font-semibold"><i class="fa-solid fa-arrow-left mr-1"></i> View Live Site</a>
        </header>

        <!-- Publish Form -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center"><i class="fa-solid fa-pen-nib text-red-500 mr-2"></i> Publish / Edit Article</h2>
            <input type="hidden" id="edit-index" value="-1">
            
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Headline</label>
                <input type="text" id="art-title" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-red-500" placeholder="Enter headline...">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Section Desk</label>
                    <select id="art-category" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-red-500">
                        <option value="dublin">Dublin News</option>
                        <option value="ireland">Ireland News</option>
                        <option value="uk">UK News</option>
                        <option value="international">International & Business/Tech</option>
                        <option value="politics">Political Hub</option>
                        <option value="sport">Sports Centre (GAA, Soccer, Rugby)</option>
                        <option value="war">Situation Room (Wars & Security)</option>
                        <option value="weather">Weather Centre</option>
                        <option value="traffic">Dublin Traffic Centre</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Tag Badge (e.g. Breaking, GAA, Dáil)</label>
                    <input type="text" id="art-tag" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-red-500" value="Breaking News">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Short Summary</label>
                <textarea id="art-summary" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-red-500" placeholder="Brief card summary..."></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Full Long-Form Article Body</label>
                <textarea id="art-body" rows="6" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-red-500" placeholder="Complete article content..."></textarea>
            </div>

            <button onclick="saveArticle()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-red-600/30">Publish Live to Portal</button>
            <p id="status-msg" class="text-xs text-center text-emerald-400 font-medium"></p>
        </div>

        <!-- Manage Existing Articles -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center"><i class="fa-solid fa-list-check text-blue-400 mr-2"></i> Manage Published Stories</h2>
            <div id="admin-articles-list" class="space-y-3"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadAdminArticles);

        function saveArticle() {
            const index = document.getElementById('edit-index').value;
            const title = document.getElementById('art-title').value;
            const category = document.getElementById('art-category').value;
            const tag = document.getElementById('art-tag').value;
            const summary = document.getElementById('art-summary').value;
            const body = document.getElementById('art-body').value;
            const msg = document.getElementById('status-msg');

            if(!title || !body) {
                alert('Headline and article body are required.');
                return;
            }

            const articles = JSON.parse(localStorage.getItem('news2day_articles') || '[]');
            const newArt = { title, category, tag, summary, body, date: '12 Nov 2026' };

            if(index === '-1') {
                articles.unshift(newArt);
            } else {
                articles[index] = newArt;
                document.getElementById('edit-index').value = '-1';
            }

            localStorage.setItem('news2day_articles', JSON.stringify(articles));
            msg.innerText = 'Successfully saved and published live!';
            
            document.getElementById('art-title').value = '';
            document.getElementById('art-summary').value = '';
            document.getElementById('art-body').value = '';
            loadAdminArticles();

            setTimeout(() => { msg.innerText = ''; }, 3000);
        }

        function loadAdminArticles() {
            const list = document.getElementById('admin-articles-list');
            const articles = JSON.parse(localStorage.getItem('news2day_articles') || '[]');
            list.innerHTML = '';

            if(articles.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-500">No custom articles published yet.</p>';
                return;
            }

            articles.forEach((art, idx) => {
                const item = document.createElement('div');
                item.className = 'bg-slate-800/70 p-3.5 rounded-xl border border-slate-700/50 flex justify-between items-center text-xs';
                item.innerHTML = `
                    <div>
                        <span class="bg-red-600/20 text-red-400 px-2 py-0.5 rounded font-bold">${art.tag}</span>
                        <p class="font-bold text-white mt-1 text-sm">${art.title}</p>
                    </div>
                    <div class="flex space-x-2 shrink-0 ml-4">
                        <button onclick="editArticle(${idx})" class="bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 px-3 py-1.5 rounded-lg font-semibold transition">Edit</button>
                        <button onclick="deleteArticle(${idx})" class="bg-red-600/20 text-red-400 hover:bg-red-600/30 px-3 py-1.5 rounded-lg font-semibold transition">Delete</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function editArticle(idx) {
            const articles = JSON.parse(localStorage.getItem('news2day_articles') || '[]');
            const art = articles[idx];
            document.getElementById('edit-index').value = idx;
            document.getElementById('art-title').value = art.title;
            document.getElementById('art-category').value = art.category;
            document.getElementById('art-tag').value = art.tag;
            document.getElementById('art-summary').value = art.summary;
            document.getElementById('art-body').value = art.body;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteArticle(idx) {
            if(confirm('Are you sure you want to delete this story?')) {
                const articles = JSON.parse(localStorage.getItem('news2day_articles') || '[]');
                articles.splice(idx, 1);
                localStorage.setItem('news2day_articles', JSON.stringify(articles));
                loadAdminArticles();
            }
        }
    </script>
</body>
</html>
